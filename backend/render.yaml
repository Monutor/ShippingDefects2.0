services:
  - type: web
    name: warehouse-brain-backend
    rootDir: backend
    env: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node start.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: POSTGRES_HOST
        fromDatabase:
          name: postgres-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: postgres-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: postgres-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: postgres-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: postgres-db
          property: password
      - key: PGCLIENTENCODING
        value: UTF8

databases:
  - name: postgres-db
    plan: free
    databaseName: warehouse_brain
    user: warehouse_brain
