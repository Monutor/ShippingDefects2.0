<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect trick
    // Store the requested path and redirect to index.html
    sessionStorage.setItem('redirect_path', window.location.pathname + window.location.search + window.location.hash);
    window.location.href = './';
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
