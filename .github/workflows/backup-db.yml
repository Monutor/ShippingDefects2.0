name: DB Backup (Monthly)

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Dump database
        run: |
          pg_dump \
            --host="${{ secrets.PG_HOST }}" \
            --port="${{ secrets.PG_PORT }}" \
            --dbname="${{ secrets.PG_DB }}" \
            --username="${{ secrets.PG_USER }}" \
            --no-password \
            --format=custom \
            --file="warehouse-brain-$(date +%Y-%m-%d).dump"
        env:
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-brain-db-backup
          path: warehouse-brain-*.dump
          retention-days: 90
