name: DB Backup (Monthly)

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18

      - name: Dump database
        run: |
          pg_dump \
            --host="${{ secrets.PG_HOST }}" \
            --port="${{ secrets.PG_PORT }}" \
            --dbname="${{ secrets.PG_DB }}" \
            --username="${{ secrets.PG_USER }}" \
            --no-password \
            --format=custom \
            --file="warehouse-brain-$(date +%Y-%m-%d).dump"
        env:
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: warehouse-brain-db-backup
          path: warehouse-brain-*.dump
          retention-days: 90
